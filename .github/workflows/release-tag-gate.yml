name: Release Tag Gate

# Blocks a release/X.Y.Z pull request whose tag already exists. Cheap to run and
# it fails at the only moment the mistake is still free to fix.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    uses: nikolareljin/ci-helpers/.github/workflows/release-tag-gate.yml@production
