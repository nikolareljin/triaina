<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>triaina</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="logo.svg" alt="" width="36" height="36">
    <h1>triaina</h1>
    <span id="conn" class="pill off">connecting</span>
    <nav><a id="fluidd" href="#" target="_blank" rel="noopener">Fluidd</a> <a href="api/docs" target="_blank" rel="noopener">API</a></nav>
  </header>

  <main>
    <section class="card" id="printer">
      <h2>Printer</h2>
      <div class="grid">
        <div><span class="label">Klipper</span><span id="klippy">-</span></div>
        <div><span class="label">State</span><span id="state">-</span></div>
        <div><span class="label">Mode</span><span id="mode">-</span></div>
        <div><span class="label">Blade</span><span id="blade">-</span></div>
        <div><span class="label">Nozzle</span><span id="nozzle">-</span></div>
        <div><span class="label">Bed</span><span id="bed">-</span></div>
        <div><span class="label">Homed</span><span id="homed">-</span></div>
        <div><span class="label">File</span><span id="file">-</span></div>
      </div>
      <div class="progress"><div id="bar"></div></div>
      <p id="message" class="muted"></p>
      <div class="buttons">
        <button data-mode="cutter">Cutter mode</button>
        <button data-mode="printer">Printer mode</button>
        <button data-action="pause">Pause</button>
        <button data-action="resume">Resume</button>
        <button data-action="cancel">Cancel</button>
        <button id="restart" hidden>Firmware restart</button>
        <button id="estop" class="danger">Emergency stop</button>
      </div>
    </section>

    <section class="card" id="camera-card" hidden>
      <h2>Camera</h2>
      <img id="camera" alt="Printer camera">
    </section>

    <section class="card">
      <h2>New job</h2>
      <form id="upload">
        <label>Type
          <select name="kind" id="kind"></select>
        </label>
        <label class="drop" id="drop">
          <input type="file" name="file" id="fileinput" required>
          <span id="dropText">Drop a file or click to choose</span>
        </label>
        <fieldset id="designOpts" hidden>
          <legend>Design options</legend>
          <label>Width (mm) <input type="number" name="width" min="1" max="400" step="any" placeholder="file size"></label>
          <label class="check"><input type="checkbox" name="fit" value="true"> Shrink to fit the bed if larger</label>
          <label>Weeding border (mm, 0 = none) <input type="number" name="weed" min="0" max="20" step="any" value="0"></label>
          <label>Blade offset (mm) <input type="number" name="blade_offset" min="0" max="2" step="any" placeholder="config"></label>
          <div id="rasterOpts">
            <label>Image threshold (0-255) <input type="number" name="threshold" min="0" max="255" value="128"></label>
            <label class="check"><input type="checkbox" name="invert" value="true"> Light design on dark background</label>
          </div>
        </fieldset>
        <fieldset id="printOpts" hidden>
          <legend>Print options</legend>
          <label id="heightRow">Thickness (mm) <input type="number" name="height" min="0.4" max="100" step="any" value="3"></label>
          <label>Layer height (mm) <input type="number" name="layer_height" min="0.05" max="0.32" step="any" value="0.2"></label>
          <label>Infill (%) <input type="number" name="infill" min="0" max="100" step="any" value="20"></label>
          <div id="modelOpts">
            <label>Scale (%) <input type="number" name="scale" min="1" max="100000" step="any" value="100"></label>
            <label class="check"><input type="checkbox" name="keep_size" value="true"> Keep size (do not shrink to fit the printer)</label>
          </div>
          <div id="mountOpts">
            <label>Holder diameter (mm) <input type="number" name="holder_diameter" min="4" max="30" step="any" value="11.5"></label>
            <label>Bolt spacing (mm) <input type="number" name="bolt_spacing" min="10" max="110" step="any" value="30"></label>
            <label>Standoff (mm) <input type="number" name="standoff" min="5" max="50" step="any" value="12"></label>
          </div>
        </fieldset>
        <button type="submit">Upload</button>
      </form>
      <p class="muted" id="kindHelp"></p>
    </section>

    <section class="card wide">
      <h2>Jobs</h2>
      <table>
        <thead><tr><th>#</th><th>Name</th><th>Type</th><th>State</th><th>Details</th><th></th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
    </section>
  </main>

  <dialog id="confirm">
    <form method="dialog">
      <h3>Start job <span id="confirmName"></span>?</h3>
      <label class="check"><input type="checkbox" id="confirmBox"> <span id="confirmText"></span></label>
      <menu>
        <button value="cancel">Back</button>
        <button value="ok" id="confirmOk" disabled>Start</button>
      </menu>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
