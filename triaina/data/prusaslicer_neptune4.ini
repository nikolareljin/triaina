# PrusaSlicer profile for the ELEGOO Neptune 4 (Klipper), used by the triaina
# service to slice on the Pi. PrusaSlicer's bundled Elegoo profiles stop at the
# Neptune 3, so this is written from the Neptune 4 specs: 225 x 225 x 265 mm,
# 0.4 mm nozzle, direct drive. Conservative PLA defaults; tune on your unit.
# Unlisted settings fall back to PrusaSlicer defaults.

# --- printer ---
printer_technology = FFF
gcode_flavor = klipper
bed_shape = 0x0,225x0,225x225,0x225
max_print_height = 265
nozzle_diameter = 0.4
retract_length = 0.8
retract_speed = 40
use_relative_e_distances = 1
use_firmware_retraction = 0
thumbnails =
# Klipper reports progress from M73 lines.
remaining_times = 1
start_gcode = ; triaina: Neptune 4 start\nG90\nM83\nM140 S[first_layer_bed_temperature]\nM104 S150\nG28\nM190 S[first_layer_bed_temperature]\nM109 S[first_layer_temperature]\nG1 Z2 F600\nG1 X5 Y20 F6000\nG1 Z0.3 F600\nG1 X5 Y200 E12 F1200\nG1 X5.5 Y200 F1200\nG1 X5.5 Y20 E12 F1200\nG1 Z2 F600
end_gcode = ; triaina: Neptune 4 end\nM104 S0\nM140 S0\nM107\nG91\nG1 Z5 F600\nG90\nG1 X10 Y220 F6000\nM84
before_layer_gcode = ;LAYER:[layer_num]
layer_gcode =

# --- filament: PLA ---
filament_diameter = 1.75
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
filament_density = 1.24
extrusion_multiplier = 1

# --- print ---
layer_height = 0.2
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 5
bottom_solid_layers = 4
fill_density = 20%
fill_pattern = gyroid
skirts = 1
skirt_distance = 5
brim_width = 0
support_material = 0
perimeter_speed = 80
external_perimeter_speed = 50
infill_speed = 120
travel_speed = 200
first_layer_speed = 30
default_acceleration = 3000
first_layer_acceleration = 1000
