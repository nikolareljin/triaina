# triaina: drag-knife cutter macros for the ELEGOO Neptune 4 (Klipper).
#
# Include from printer.cfg:
#   [include klipper_cutter_macros.cfg]
#
# Edit the variables in _TRIAINA_VARS to match your knife holder. Every other
# macro reads its numbers from there, so there is one place to tune.
# Full reference: docs/reference/klipper-macros.md

[gcode_macro _TRIAINA_VARS]
description: triaina settings and runtime state. Edit the variable_ lines.
# Nozzle position minus knife-tip position, in mm. Klipper adds a G-code
# offset to every move, so X=32 suits a knife 32 mm LEFT of the nozzle and job
# coordinates then address the blade tip. offset_z is how far the knife tip
# sits below the nozzle tip (positive). See docs/hardware/knife-mount.md.
variable_offset_x: 32.0
variable_offset_y: -5.0
variable_offset_z: 0.0
# Z (mm, above the bed surface) at which the blade cuts through vinyl into the
# backing. Start high (0.3) and lower in 0.05 steps until weeding is clean.
variable_z_cut: 0.1
# Z (mm) for travel moves between cuts. Must clear the mat and the blade spring.
variable_z_travel: 3.0
# Z feedrates (mm/min). Plunge slowly so the swivel blade can align.
variable_plunge_feed: 300
variable_retract_feed: 600
# Cutter motion limits. Low accel stops the swivel blade chattering at corners.
variable_cutter_accel: 1000
variable_cutter_velocity: 100
variable_cutter_scv: 2.0
# Runtime state. Written by the macros, do not edit.
variable_mode: 'printer'
variable_saved_accel: 0.0
variable_saved_velocity: 0.0
variable_saved_scv: 0.0
variable_blade_down: False
gcode:
  # Holder only; never called.

[gcode_macro CUTTER_MODE]
description: Switch to drag-knife cutting: heaters and fans off, slow accel, knife offset.
gcode:
  {% set v = printer["gcode_macro _TRIAINA_VARS"] %}
  {% set th = printer.toolhead %}
  {% if v.mode != 'cutter' %}
    # Remember the limits in force now, so PRINTER_MODE restores exactly them.
    SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=saved_accel VALUE={th.max_accel}
    SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=saved_velocity VALUE={th.max_velocity}
    SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=saved_scv VALUE={th.square_corner_velocity}
  {% endif %}
  M104 S0
  M140 S0
  M107
  SET_VELOCITY_LIMIT ACCEL={v.cutter_accel} VELOCITY={v.cutter_velocity} SQUARE_CORNER_VELOCITY={v.cutter_scv}
  SET_GCODE_OFFSET X={v.offset_x} Y={v.offset_y} Z={v.offset_z}
  SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=mode VALUE="'cutter'"
  # action_respond_info needs no [respond] section, unlike RESPOND / M118.
  {action_respond_info("triaina: CUTTER_MODE active (offset X=%s Y=%s Z=%s, accel %s)" % (v.offset_x, v.offset_y, v.offset_z, v.cutter_accel))}

[gcode_macro PRINTER_MODE]
description: Return to FDM printing: lift blade, restore saved limits, clear offsets.
gcode:
  {% set v = printer["gcode_macro _TRIAINA_VARS"] %}
  {% if v.blade_down %}
    CUT_RETRACT
  {% endif %}
  {% if v.mode == 'cutter' and v.saved_accel > 0 %}
    SET_VELOCITY_LIMIT ACCEL={v.saved_accel} VELOCITY={v.saved_velocity} SQUARE_CORNER_VELOCITY={v.saved_scv}
  {% endif %}
  SET_GCODE_OFFSET X=0 Y=0 Z=0
  SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=mode VALUE="'printer'"
  {action_respond_info("triaina: PRINTER_MODE active. Remove the knife holder before printing.")}

[gcode_macro CUT_PLUNGE]
description: Lower the blade to z_cut. Refuses outside CUTTER_MODE or when not homed.
gcode:
  {% set v = printer["gcode_macro _TRIAINA_VARS"] %}
  {% if v.mode != 'cutter' %}
    {action_raise_error("CUT_PLUNGE refused: run CUTTER_MODE first")}
  {% endif %}
  {% if 'xyz' not in printer.toolhead.homed_axes %}
    {action_raise_error("CUT_PLUNGE refused: home all axes (G28) first")}
  {% endif %}
  SAVE_GCODE_STATE NAME=_triaina_plunge
  G90
  G1 Z{v.z_cut} F{v.plunge_feed}
  RESTORE_GCODE_STATE NAME=_triaina_plunge
  SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=blade_down VALUE=True

[gcode_macro CUT_RETRACT]
description: Lift the blade to z_travel for a travel move.
gcode:
  {% set v = printer["gcode_macro _TRIAINA_VARS"] %}
  {% if 'z' in printer.toolhead.homed_axes %}
    SAVE_GCODE_STATE NAME=_triaina_retract
    G90
    G1 Z{v.z_travel} F{v.retract_feed}
    RESTORE_GCODE_STATE NAME=_triaina_retract
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_TRIAINA_VARS VARIABLE=blade_down VALUE=False
