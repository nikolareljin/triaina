<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>triaina</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="cutLineGrad" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="412" y2="0">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.2" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="76" y="76" width="360" height="360" rx="24" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="12 12" />
  <line x1="256" y1="40" x2="256" y2="472" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" />
  <line x1="40" y1="256" x2="472" y2="256" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" />
  <!-- Cut line the blade is tracing -->
  <line x1="100" y1="397" x2="412" y2="397" stroke="url(#cutLineGrad)" stroke-width="4" stroke-linecap="round" />
  <g transform="translate(256, 250) scale(0.92)">
    <!-- Shaft -->
    <rect x="-7" y="-20" width="14" height="172" rx="4" fill="#CBD5E1" />
    <!-- Curved crossbar joining the three prongs -->
    <path d="M -86 -105 L -86 -60 Q -86 -12 -38 -12 L 38 -12 Q 86 -12 86 -60 L 86 -105"
          fill="none" stroke="#38BDF8" stroke-width="14" stroke-linejoin="round" />
    <!-- Centre prong -->
    <rect x="-7" y="-150" width="14" height="140" fill="#E2E8F0" />
    <!-- Barbed heads: centre, left, right -->
    <path d="M 0 -212 L 24 -140 L 7 -152 L 0 -146 L -7 -152 L -24 -140 Z" fill="#F8FAFC" />
    <path d="M -86 -168 L -66 -104 L -80 -114 L -86 -108 L -92 -114 L -106 -104 Z" fill="#38BDF8" />
    <path d="M 86 -168 L 106 -104 L 92 -114 L 86 -108 L 80 -114 L 66 -104 Z" fill="#0284C7" />
    <!-- Plunge point on the cut line -->
    <circle cx="0" cy="160" r="7" fill="#38BDF8" />
    <circle cx="0" cy="160" r="16" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
  </g>
  <circle cx="100" cy="397" r="6" fill="#38BDF8" />
  <circle cx="412" cy="397" r="6" fill="#38BDF8" />
</svg>
