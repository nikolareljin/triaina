[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triaina"
dynamic = ["version"]
description = "Run an ELEGOO Neptune 4 as an FDM printer and a drag-knife vinyl cutter"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
  # uvicorn alone answers websocket upgrades with "Unsupported upgrade request".
  "websockets>=12",
  # Cut pipeline: SVG and DXF parsing, image thresholding.
  "svgelements>=1.9",
  "ezdxf>=1.1",
  "pillow>=10",
  # 3D: extrusion and the knife mount (exact booleans; arm64 wheels exist).
  "manifold3d>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "flake8>=7.0", "httpx>=0.27"]

[project.scripts]
triaina = "triaina.__main__:main"

[project.urls]
Homepage = "https://nikolareljin.github.io/triaina/"
Source = "https://github.com/nikolareljin/triaina"

[tool.setuptools.packages.find]
include = ["triaina*"]

[tool.setuptools.dynamic]
version = { attr = "triaina.__version__" }

[tool.setuptools.package-data]
"triaina.data" = ["*.ini"]
"triaina.web" = ["static/*"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "scripts/script-helpers"

[tool.pytest.ini_options]
testpaths = ["tests"]
