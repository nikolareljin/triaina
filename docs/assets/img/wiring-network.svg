<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Topology A: Raspberry Pi on the network, talking to the Neptune 4 built-in Moonraker</title>
  <rect width="900" height="520" fill="#0f172a"/>
  <text x="24" y="34" font-size="16" fill="#f8fafc">Topology A (recommended): network only, no printer rework</text>

  <!-- mains -->
  <rect x="24" y="420" width="120" height="60" rx="6" fill="#1e293b" stroke="#f87171"/>
  <text x="84" y="446" fill="#f87171" text-anchor="middle">mains outlet</text>
  <text x="84" y="464" fill="#94a3b8" text-anchor="middle">100-240 V AC</text>

  <!-- Pi PSU -->
  <rect x="200" y="400" width="140" height="56" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="270" y="424" fill="#fbbf24" text-anchor="middle">Pi PSU</text>
  <text x="270" y="442" fill="#94a3b8" text-anchor="middle">5.1 V 2.5 A micro-USB</text>

  <!-- Pi -->
  <rect x="200" y="200" width="200" height="130" rx="10" fill="#166534" stroke="#22c55e" stroke-width="2"/>
  <text x="300" y="226" fill="#f8fafc" text-anchor="middle">Raspberry Pi 3 Model B</text>
  <text x="300" y="248" fill="#bbf7d0" text-anchor="middle">triaina scripts</text>
  <text x="300" y="266" fill="#bbf7d0" text-anchor="middle">gcode_preprocessor.py</text>
  <text x="300" y="284" fill="#bbf7d0" text-anchor="middle">mode_switch.py</text>
  <text x="300" y="302" fill="#bbf7d0" text-anchor="middle">(optional) camera stream</text>
  <rect x="240" y="330" width="22" height="10" fill="#fbbf24"/>
  <rect x="400" y="290" width="12" height="26" fill="#94a3b8"/>

  <!-- camera -->
  <rect x="40" y="225" width="90" height="70" rx="6" fill="#1e293b" stroke="#94a3b8"/>
  <text x="85" y="255" fill="#e2e8f0" text-anchor="middle">Pi camera</text>
  <text x="85" y="273" fill="#94a3b8" text-anchor="middle">optional</text>

  <!-- router -->
  <rect x="470" y="70" width="150" height="70" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="545" y="100" fill="#38bdf8" text-anchor="middle">home router</text>
  <text x="545" y="120" fill="#94a3b8" text-anchor="middle">LAN / Wi-Fi</text>

  <!-- laptop -->
  <rect x="200" y="70" width="170" height="70" rx="8" fill="#1e293b" stroke="#94a3b8"/>
  <text x="285" y="98" fill="#e2e8f0" text-anchor="middle">laptop</text>
  <text x="285" y="118" fill="#94a3b8" text-anchor="middle">Inkscape, browser</text>

  <!-- printer -->
  <rect x="640" y="200" width="230" height="200" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="755" y="226" fill="#f8fafc" text-anchor="middle">ELEGOO Neptune 4</text>
  <rect x="660" y="240" width="190" height="64" rx="6" fill="#0b1220" stroke="#38bdf8"/>
  <text x="755" y="262" fill="#38bdf8" text-anchor="middle">built-in Linux host</text>
  <text x="755" y="280" fill="#94a3b8" text-anchor="middle">Klipper + Moonraker :7125</text>
  <text x="755" y="296" fill="#94a3b8" text-anchor="middle">Fluidd :80</text>
  <rect x="660" y="318" width="190" height="40" rx="6" fill="#0b1220" stroke="#64748b"/>
  <text x="755" y="343" fill="#94a3b8" text-anchor="middle">STM32 MCU, steppers, heaters</text>
  <text x="755" y="385" fill="#f87171" text-anchor="middle">own PSU, mains</text>

  <!-- links -->
  <g fill="none" stroke-width="3">
    <path d="M144 450 H200" stroke="#f87171"/>
    <path d="M270 400 V340 H251" stroke="#fbbf24"/>
    <path d="M144 470 H180 V490 H755 V400" stroke="#f87171"/>
    <path d="M130 260 H200" stroke="#94a3b8" stroke-dasharray="6 4"/>
    <path d="M412 303 H440 V105 H470" stroke="#38bdf8"/>
    <path d="M370 105 H470" stroke="#38bdf8" stroke-dasharray="6 4"/>
    <path d="M620 105 H755 V200" stroke="#38bdf8" stroke-dasharray="6 4"/>
    <path d="M755 304 V318" stroke="#64748b"/>
  </g>
  <g fill="#e2e8f0" font-size="12">
    <text x="150" y="440">AC</text>
    <text x="276" y="372">micro-USB 5 V</text>
    <text x="134" y="250">CSI ribbon</text>
    <text x="446" y="200">Ethernet</text>
    <text x="380" y="95">Wi-Fi</text>
    <text x="640" y="95">Wi-Fi or Ethernet</text>
    <text x="760" y="160" text-anchor="end">HTTP: /printer/gcode/script</text>
    <text x="760" y="176" text-anchor="end">/server/files/upload</text>
    <text x="764" y="312" fill="#94a3b8">internal</text>
  </g>
  <text x="24" y="510" fill="#94a3b8" font-size="12">No USB cable between the Pi and the printer. Jobs and mode switches travel as HTTP requests to Moonraker.</text>
</svg>
