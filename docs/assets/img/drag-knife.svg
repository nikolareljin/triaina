<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Roland-style spring drag-knife holder and blade, side view</title>
  <rect width="560" height="300" fill="#0f172a"/>
  <!-- holder body -->
  <rect x="60" y="120" width="300" height="44" rx="8" fill="#cbd5e1" stroke="#94a3b8"/>
  <rect x="40" y="128" width="24" height="28" rx="4" fill="#64748b"/>
  <!-- spring window -->
  <path d="M110 130 l10 24 l10 -24 l10 24 l10 -24 l10 24 l10 -24 l10 24" stroke="#0284c7" stroke-width="3" fill="none"/>
  <!-- nose -->
  <path d="M360 126 L410 134 L410 150 L360 158 Z" fill="#94a3b8"/>
  <!-- blade -->
  <rect x="410" y="139" width="70" height="6" fill="#e5e7eb"/>
  <path d="M480 139 L500 142 L480 145 Z" fill="#38bdf8"/>
  <!-- offset callout -->
  <g stroke="#38bdf8" stroke-width="1.5"><path d="M490 120 V136 M500 120 V136 M490 124 H500"/></g>
  <text x="495" y="110" fill="#38bdf8" text-anchor="middle">tip offset ~0.25 mm</text>
  <g fill="#e2e8f0">
    <text x="20" y="30" font-size="14" fill="#f8fafc">Spring-loaded drag knife (Roland CAMM-1 style)</text>
    <text x="40" y="200">depth knob</text>
    <text x="110" y="200">spring: sets cutting force</text>
    <text x="330" y="200">bearing nose</text>
    <text x="410" y="200">45 deg blade (vinyl)</text>
    <text x="410" y="216">60 deg blade (thick media)</text>
    <text x="40" y="260">The blade swivels freely. Its tip trails the holder axis by the tip offset,</text>
    <text x="40" y="276">which is why cutters slow down and overcut at corners.</text>
  </g>
</svg>
