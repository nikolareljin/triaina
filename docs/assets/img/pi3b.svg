<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 380" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Raspberry Pi 3 Model B, top view, ports labelled</title>
  <rect width="610" height="380" fill="#0f172a"/>
  <!-- board 85 x 56 mm at 5 px/mm -->
  <g transform="translate(60,60)">
    <rect width="425" height="280" rx="15" fill="#166534" stroke="#22c55e" stroke-width="2"/>
    <!-- mounting holes -->
    <g fill="#0f172a" stroke="#fbbf24" stroke-width="2">
      <circle cx="17" cy="17" r="8"/><circle cx="307" cy="17" r="8"/>
      <circle cx="17" cy="262" r="8"/><circle cx="307" cy="262" r="8"/>
    </g>
    <!-- 40 pin GPIO header -->
    <rect x="40" y="8" width="252" height="26" fill="#111827" stroke="#9ca3af"/>
    <g fill="#d1d5db">
      <!-- 20 x 2 pins -->
      <path d="M46 12h6v6h-6zM58 12h6v6h-6zM70 12h6v6h-6zM82 12h6v6h-6zM94 12h6v6h-6zM106 12h6v6h-6zM118 12h6v6h-6zM130 12h6v6h-6zM142 12h6v6h-6zM154 12h6v6h-6zM166 12h6v6h-6zM178 12h6v6h-6zM190 12h6v6h-6zM202 12h6v6h-6zM214 12h6v6h-6zM226 12h6v6h-6zM238 12h6v6h-6zM250 12h6v6h-6zM262 12h6v6h-6zM274 12h6v6h-6z"/>
      <path d="M46 24h6v6h-6zM58 24h6v6h-6zM70 24h6v6h-6zM82 24h6v6h-6zM94 24h6v6h-6zM106 24h6v6h-6zM118 24h6v6h-6zM130 24h6v6h-6zM142 24h6v6h-6zM154 24h6v6h-6zM166 24h6v6h-6zM178 24h6v6h-6zM190 24h6v6h-6zM202 24h6v6h-6zM214 24h6v6h-6zM226 24h6v6h-6zM238 24h6v6h-6zM250 24h6v6h-6zM262 24h6v6h-6zM274 24h6v6h-6z"/>
    </g>
    <!-- SoC and RAM -->
    <rect x="120" y="100" width="70" height="70" fill="#374151" stroke="#9ca3af"/>
    <text x="155" y="140" fill="#e5e7eb" text-anchor="middle">BCM2837</text>
    <!-- USB / Ethernet stack on the right edge -->
    <rect x="345" y="12" width="95" height="66" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="345" y="92" width="95" height="66" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="345" y="178" width="95" height="82" fill="#94a3b8" stroke="#475569"/>
    <g fill="#1e293b"><rect x="360" y="25" width="70" height="14"/><rect x="360" y="51" width="70" height="14"/>
      <rect x="360" y="105" width="70" height="14"/><rect x="360" y="131" width="70" height="14"/></g>
    <rect x="365" y="195" width="60" height="48" fill="#1e293b"/>
    <!-- bottom edge: micro USB power, HDMI, audio -->
    <rect x="40" y="262" width="40" height="22" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="120" y="258" width="76" height="30" fill="#cbd5e1" stroke="#64748b"/>
    <rect x="238" y="262" width="30" height="24" fill="#111827" stroke="#64748b"/>
    <!-- camera CSI connector -->
    <rect x="215" y="200" width="12" height="55" fill="#f8fafc" stroke="#64748b"/>
    <!-- microSD on underside, left edge -->
    <rect x="-12" y="110" width="22" height="60" fill="#475569" stroke="#94a3b8" stroke-dasharray="4 3"/>
  </g>
  <!-- labels -->
  <g fill="#e2e8f0">
    <text x="60" y="40">40-pin GPIO header (not used by triaina)</text>
    <text x="510" y="80" fill="#38bdf8">USB-A x2</text>
    <text x="510" y="160" fill="#38bdf8">USB-A x2</text>
    <text x="510" y="275" fill="#38bdf8">Ethernet</text>
    <text x="60" y="370" fill="#fbbf24">micro-USB power IN (5.1 V 2.5 A)</text>
    <text x="300" y="370">HDMI</text>
    <text x="420" y="370">audio</text>
    <text x="8" y="242">microSD</text>
    <text x="8" y="256">(underside)</text>
    <text x="270" y="250">camera CSI</text>
  </g>
  <g stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path d="M505 160 H500"/><path d="M505 76 H500"/><path d="M505 270 H500"/>
  </g>
</svg>
