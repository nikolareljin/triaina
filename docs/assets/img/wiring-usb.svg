<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Topology B: Raspberry Pi as the Klipper host, USB to the printer MCU with 5 V blocked</title>
  <rect width="900" height="520" fill="#0f172a"/>
  <text x="24" y="34" font-size="16" fill="#f8fafc">Topology B (advanced): Pi is the Klipper host, USB serial to the MCU</text>

  <rect x="24" y="420" width="120" height="60" rx="6" fill="#1e293b" stroke="#f87171"/>
  <text x="84" y="446" fill="#f87171" text-anchor="middle">mains outlet</text>
  <text x="84" y="464" fill="#94a3b8" text-anchor="middle">100-240 V AC</text>

  <rect x="200" y="400" width="140" height="56" rx="6" fill="#1e293b" stroke="#fbbf24"/>
  <text x="270" y="424" fill="#fbbf24" text-anchor="middle">Pi PSU</text>
  <text x="270" y="442" fill="#94a3b8" text-anchor="middle">5.1 V 2.5 A micro-USB</text>

  <rect x="200" y="180" width="210" height="150" rx="10" fill="#166534" stroke="#22c55e" stroke-width="2"/>
  <text x="305" y="206" fill="#f8fafc" text-anchor="middle">Raspberry Pi 3 Model B</text>
  <text x="305" y="228" fill="#bbf7d0" text-anchor="middle">Klipper host (klippy)</text>
  <text x="305" y="246" fill="#bbf7d0" text-anchor="middle">Moonraker :7125, Fluidd</text>
  <text x="305" y="264" fill="#bbf7d0" text-anchor="middle">printer.cfg + triaina macros</text>
  <text x="305" y="282" fill="#bbf7d0" text-anchor="middle">serial: /dev/triaina</text>
  <rect x="240" y="330" width="22" height="10" fill="#fbbf24"/>
  <rect x="410" y="200" width="14" height="22" fill="#94a3b8"/>

  <!-- cable with taped pin -->
  <rect x="470" y="196" width="60" height="30" rx="4" fill="#cbd5e1"/>
  <rect x="474" y="200" width="16" height="22" fill="#f59e0b" opacity="0.8"/>
  <text x="500" y="250" fill="#f59e0b" text-anchor="middle">pin 1 (5 V)</text>
  <text x="500" y="266" fill="#f59e0b" text-anchor="middle">Kapton-taped</text>

  <rect x="640" y="160" width="230" height="230" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="755" y="186" fill="#f8fafc" text-anchor="middle">ELEGOO Neptune 4</text>
  <rect x="660" y="200" width="190" height="56" rx="6" fill="#0b1220" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="755" y="224" fill="#94a3b8" text-anchor="middle">built-in host</text>
  <text x="755" y="242" fill="#94a3b8" text-anchor="middle">Klipper service stopped</text>
  <rect x="660" y="270" width="190" height="72" rx="6" fill="#0b1220" stroke="#38bdf8"/>
  <text x="755" y="294" fill="#38bdf8" text-anchor="middle">STM32 MCU</text>
  <text x="755" y="312" fill="#94a3b8" text-anchor="middle">Klipper MCU firmware,</text>
  <text x="755" y="330" fill="#94a3b8" text-anchor="middle">USB serial 250000</text>
  <text x="755" y="378" fill="#f87171" text-anchor="middle">own PSU, mains</text>

  <g fill="none" stroke-width="3">
    <path d="M144 450 H200" stroke="#f87171"/>
    <path d="M270 400 V340 H251" stroke="#fbbf24"/>
    <path d="M144 470 H180 V490 H755 V390" stroke="#f87171"/>
    <path d="M424 211 H470" stroke="#38bdf8"/>
    <path d="M530 211 H600 V306 H660" stroke="#38bdf8"/>
  </g>
  <g fill="#e2e8f0" font-size="12">
    <text x="276" y="372">micro-USB 5 V</text>
    <text x="540" y="200">USB data + GND only</text>
  </g>
  <text x="24" y="120" fill="#fbbf24" font-size="13">Why the tape: both boards have their own 5 V supply. With VBUS connected the Pi</text>
  <text x="24" y="138" fill="#fbbf24" font-size="13">back-feeds the MCU (and the printer back-feeds the Pi), which can brown out or damage either.</text>
  <text x="24" y="510" fill="#94a3b8" font-size="12">Requires flashing Klipper MCU firmware with a USB interface and disabling the built-in host. See Wiring, Topology B.</text>
</svg>
