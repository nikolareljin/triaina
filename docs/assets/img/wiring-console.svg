<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>Optional console cable: Pi USB-A to the Neptune 4 USB-C console port, 5 V blocked</title>
  <rect width="900" height="460" fill="#0f172a"/>
  <text x="24" y="34" font-size="16" fill="#f8fafc">Optional: USB-C console cable (recovery only, no print jobs)</text>

  <rect x="40" y="110" width="230" height="150" rx="10" fill="#166534" stroke="#22c55e" stroke-width="2"/>
  <text x="155" y="136" fill="#f8fafc" text-anchor="middle">Raspberry Pi 3 Model B</text>
  <text x="155" y="160" fill="#bbf7d0" text-anchor="middle">/dev/triaina (setup_pi.sh --udev)</text>
  <text x="155" y="180" fill="#bbf7d0" text-anchor="middle">screen /dev/triaina 1500000</text>
  <text x="155" y="230" fill="#bbf7d0" text-anchor="middle">own 5.1 V supply</text>
  <rect x="270" y="150" width="14" height="22" fill="#94a3b8"/>

  <rect x="330" y="146" width="60" height="30" rx="4" fill="#cbd5e1"/>
  <rect x="334" y="150" width="16" height="22" fill="#f59e0b" opacity="0.8"/>
  <text x="360" y="200" fill="#f59e0b" text-anchor="middle">pin 1 (5 V)</text>
  <text x="360" y="216" fill="#f59e0b" text-anchor="middle">Kapton-taped</text>

  <rect x="560" y="90" width="300" height="250" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
  <text x="710" y="116" fill="#f8fafc" text-anchor="middle">ELEGOO Neptune 4</text>
  <rect x="580" y="130" width="260" height="70" rx="6" fill="#0b1220" stroke="#38bdf8"/>
  <text x="710" y="156" fill="#38bdf8" text-anchor="middle">built-in Linux host</text>
  <text x="710" y="176" fill="#94a3b8" text-anchor="middle">serial console 1500000 baud</text>
  <rect x="580" y="240" width="260" height="56" rx="6" fill="#0b1220" stroke="#64748b"/>
  <text x="710" y="264" fill="#94a3b8" text-anchor="middle">STM32 MCU</text>
  <text x="710" y="282" fill="#94a3b8" text-anchor="middle">internal link only</text>
  <path d="M710 200 V240" stroke="#64748b" stroke-width="3"/>
  <rect x="546" y="158" width="14" height="10" rx="2" fill="#38bdf8"/>
  <text x="540" y="150" fill="#38bdf8" text-anchor="end">USB-C</text>

  <g fill="none" stroke-width="3">
    <path d="M284 161 H330" stroke="#38bdf8"/>
    <path d="M390 161 H546" stroke="#38bdf8"/>
  </g>
  <text x="470" y="186" fill="#e2e8f0" font-size="12" text-anchor="middle">data + GND only</text>

  <text x="24" y="390" fill="#fbbf24">Why the tape: both sides have their own 5 V supply. With VBUS connected one back-feeds the other.</text>
  <text x="24" y="420" fill="#94a3b8" font-size="12">Jobs, mode switches and status always go over the network to Moonraker, never over this cable.</text>
</svg>
