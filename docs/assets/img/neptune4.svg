<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>ELEGOO Neptune 4, front view, with cutter parts labelled</title>
  <rect width="560" height="460" fill="#0f172a"/>
  <!-- base -->
  <rect x="70" y="360" width="420" height="60" rx="6" fill="#1f2937" stroke="#64748b"/>
  <rect x="380" y="372" width="90" height="36" rx="4" fill="#0b1220" stroke="#38bdf8"/>
  <text x="425" y="394" fill="#38bdf8" text-anchor="middle">screen</text>
  <!-- uprights -->
  <rect x="95" y="60" width="22" height="300" fill="#334155"/>
  <rect x="443" y="60" width="22" height="300" fill="#334155"/>
  <rect x="95" y="50" width="370" height="20" fill="#334155"/>
  <!-- bed and mat -->
  <rect x="130" y="330" width="300" height="12" fill="#475569"/>
  <rect x="150" y="318" width="260" height="12" fill="#a3e635" opacity="0.85"/>
  <rect x="190" y="314" width="140" height="4" fill="#f472b6"/>
  <!-- gantry -->
  <rect x="95" y="160" width="370" height="20" fill="#64748b"/>
  <!-- toolhead -->
  <rect x="220" y="140" width="80" height="110" rx="6" fill="#1e293b" stroke="#94a3b8"/>
  <path d="M252 250 L260 266 L268 250 Z" fill="#fbbf24"/>
  <!-- knife holder clamped to toolhead -->
  <rect x="182" y="170" width="38" height="18" fill="#0284c7"/>
  <rect x="172" y="150" width="18" height="140" rx="4" fill="#cbd5e1" stroke="#38bdf8" stroke-width="2"/>
  <path d="M178 290 L181 300 L184 290 Z" fill="#38bdf8"/>
  <!-- dimension: offset_x -->
  <g stroke="#38bdf8" stroke-width="1.5">
    <path d="M260 270 V290 M181 306 V290 M181 286 H260"/>
  </g>
  <text x="220" y="282" fill="#38bdf8" text-anchor="middle">offset_x</text>
  <!-- labels -->
  <g fill="#e2e8f0">
    <text x="20" y="30" font-size="14" fill="#f8fafc">ELEGOO Neptune 4 (front)</text>
    <text x="310" y="135">toolhead + nozzle</text>
    <text x="40" y="215">drag-knife holder</text>
    <text x="40" y="231">(printed clamp)</text>
    <text x="440" y="312">cutting mat</text>
    <text x="440" y="326">on PEI sheet</text>
    <text x="340" y="308" fill="#f472b6">vinyl</text>
    <text x="80" y="440">mainboard + built-in Klipper host inside base</text>
    <text x="480" y="440" fill="#38bdf8">USB-C</text>
  </g>
  <rect x="490" y="380" width="12" height="8" rx="2" fill="#38bdf8"/>
</svg>
